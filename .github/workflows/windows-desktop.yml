name: MySpoti Windows desktop

on:
  push:
    branches: [myspoti-windows-port]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myspoti-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out Windows port
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out original MySpoti modules
        uses: actions/checkout@v7
        with:
          repository: kota-zo/Orpheon
          ref: 70f323c5e5c3c21305b3177eb681e84ba02ce872
          path: upstream
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"

      - name: Build Windows packages
        working-directory: desktop
        run: gradle --no-daemon packageExe packageMsi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v6
        with:
          name: MySpoti-Windows-preview
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14
